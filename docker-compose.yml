services:
  radio:
    build: .
    container_name: ai-radio
    restart: unless-stopped
    ports:
      - "8100:8000"
    environment:
      DEEPSEEK_KEY: ""            # 填入 DeepSeek key 后重启生效
      DEEPSEEK_BASE: "https://api.deepseek.com"
      DEEPSEEK_MODEL: "deepseek-chat"
      NAS_LIST_URL: "http://192.168.1.88:8080/list.php"
      NAS_BASE_URL: "http://192.168.1.88:8080"
      HOST_NAME: "小蓝"
    volumes:
      - ./backend:/srv          # 代码热挂载, 改代码重启即生效
      - ./data:/data
