limit_req_zone $binary_remote_addr zone=tingjian_api:1m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=tingjian_ip:1m;
limit_conn_zone $server_name zone=tingjian_site:1m;

server {
    listen 80;
    listen [::]:80;
    server_name audio.deline.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 308 https://audio.deline.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name audio.deline.top;

    ssl_certificate /etc/letsencrypt/live/audio.deline.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audio.deline.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 10m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;

    location ^~ /api/playback/announcement/ {
        proxy_pass http://127.0.0.1:8100;
    }

    location = /api/playback/availability {
        proxy_pass http://127.0.0.1:8100;
    }

    location /api/ {
        limit_req zone=tingjian_api burst=8 nodelay;
        limit_req_status 429;
        limit_conn tingjian_ip 3;
        limit_conn tingjian_site 8;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8100;
    }

    location /music/ {
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_pass http://127.0.0.1:8001/;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
    }
}
