<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>开源致谢 · 听间</title>
  <link rel="icon" href="assets/brand.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light;--bg:#fafbfc;--text:#25292f;--muted:#656d77;--line:#dfe3e8;--accent:#245db0;--hover:#eef2f7}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0;font-size:15px;line-height:1.8}main{max-width:840px;margin:auto;padding:24px 28px 48px}header{display:flex;align-items:center;gap:12px;padding-bottom:22px;border-bottom:1px solid var(--line)}.brand{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-size:21px;font-weight:650}.brand img{width:34px;height:34px}.languages{display:flex;margin-left:auto;gap:4px}.languages button{min-height:36px;padding:4px 10px;border:0;border-radius:4px;background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}.languages button[aria-pressed="true"]{background:var(--hover);color:var(--text);font-weight:600}h1{font-size:28px;line-height:1.3;margin:30px 0 10px}h2{font-size:17px;line-height:1.5;margin:0 0 5px}h3{font-size:15px;margin:20px 0 6px}a{color:var(--accent);text-underline-offset:4px;overflow-wrap:anywhere}p{margin:6px 0 12px}.intro{color:var(--muted);margin-bottom:24px}.credit{display:grid;grid-template-columns:190px minmax(0,1fr);gap:24px;padding:20px 0;border-top:1px solid var(--line)}.credit p:last-child{margin-bottom:0}.credit h2 a{color:var(--text);text-decoration:none}.credit h2 a:hover{text-decoration:underline}.byline{display:block;color:var(--muted);font-size:13px}details{border-top:1px solid var(--line);padding:16px 0}summary{cursor:pointer;min-height:32px;font-weight:600}details .detail-content{padding:0 0 4px 18px;color:var(--muted)}code{font-size:12px;overflow-wrap:anywhere}footer{border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 22px;padding-top:20px;font-size:13px}footer a{display:inline-flex;align-items:center;gap:5px}footer img{width:14px;height:14px;opacity:.65}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #86b5fa;outline-offset:4px}
    @media(max-width:560px){main{padding:20px 20px 32px}.credit{grid-template-columns:1fr;gap:6px;padding:18px 0}h1{font-size:25px}.languages button{padding:4px 8px}footer{gap:12px 18px}}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#171a1e;--text:#edf0f3;--muted:#a7afb9;--line:#333941;--accent:#91baff;--hover:#2b3139}footer img{filter:invert(1)}}
  </style>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="./" target="_blank" rel="noopener noreferrer" aria-label="在新标签页打开听间"><img src="assets/brand.svg" alt=""><span id="brand-name">听间</span></a>
      <div class="languages" role="group" aria-label="语言 / Language"><button type="button" data-language="zh" aria-pressed="true">中文</button><button type="button" data-language="en" aria-pressed="false">English</button></div>
    </header>
    <h1 id="page-title">开源致谢</h1>
    <p class="intro" id="intro">听间的成长，离不开开源作者、工具维护者与创作者的分享。感谢以下项目与资源。</p>
    <div id="credits"></div>
    <noscript><p>致谢与许可证详情请参阅<a href="https://github.com/HachikoJ/easy-radio-host#致谢" target="_blank" rel="noopener noreferrer">项目说明</a>。</p></noscript>
    <footer>
      <a href="https://github.com/HachikoJ/easy-radio-host" target="_blank" rel="noopener noreferrer"><span data-zh="项目源码" data-en="Project Source">项目源码</span><img src="assets/ArrowUpRight.svg" alt=""></a>
      <a href="https://github.com/HachikoJ" target="_blank" rel="noopener noreferrer"><span data-zh="联系作者 · GitHub" data-en="Author · GitHub">联系作者 · GitHub</span><img src="assets/ArrowUpRight.svg" alt=""></a>
      <a id="back" href="./" target="_blank" rel="noopener noreferrer"><span data-zh="新标签页打开电台" data-en="Open Radio in New Tab">新标签页打开电台</span><img src="assets/ArrowUpRight.svg" alt=""></a>
    </footer>
  </main>
  <script>
    const link = (url, label) => '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>';
    const claudioRevision = 'c2eb8111dfba34437c047315ab827cbc58e33761';
    const qiaomuRevision = 'a8519a23e0038a49cfa9495cc0b420a3b4e4825d';
    const embeatRevision = '7617a505ec42f109685802d1a3319e1957ac0a99';
    const embeatRoot = 'https://github.com/gdstudio-org/Embeat/blob/' + embeatRevision + '/';
    const credits = [
      {
        name: 'easy-radio-host', url: 'https://gitee.com/weak0001/easy-radio-host',
        by: {zh: 'weak0001 · 原始项目', en: 'weak0001 · Original project'},
        text: {
          zh: '听间由这一项目改造而来，保留原作者署名与版权归属。原始代码完整授权尚未核清，本仓库未声明统一开源许可证。',
          en: "Tingjian is adapted from this project and retains its original attribution and ownership. The original code's complete licensing terms remain unverified; this repository has not adopted a unified open source license."
        }
      },
      {
        name: 'Claudio', url: 'https://github.com/hllqkb/Claudio',
        by: {zh: 'hllqkb · 交互参考', en: 'hllqkb · Interaction reference'},
        text: {
          zh: '为专注播放、明暗主题、收藏、收听历史与系统媒体控制提供交互启发。听间围绕自己的队列与接口独立实现。',
          en: 'Interaction ideas for focused listening, light and dark themes, favorites, listening history, and system media controls. Tingjian implements them independently for its own queue and APIs.'
        }
      },
      {
        name: 'Qiaomu Music Player Web', url: 'https://github.com/joeseesun/qiaomu-music-player-web',
        by: {zh: '向阳乔木 · 播放体验参考', en: 'Qiaomu · Playback reference'},
        text: {
          zh: '逐行歌词、点按跳播与动效开关的交互参考。旋转唱片和外围律动也参考了常见音乐播放器的通用交互，由听间独立实现。',
          en: 'Interaction ideas for line-by-line lyrics, lyric seeking, and motion controls. The rotating disc and surrounding motion also draw on common music-player interactions, independently implemented by Tingjian.'
        }
      },
      {
        name: 'Embeat', url: 'https://github.com/gdstudio-org/Embeat/tree/' + embeatRevision,
        by: {zh: 'GD Studio · 推荐思路参考', en: 'GD Studio · Recommendation reference'},
        text: {
          zh: '借鉴候选融合、去重、歌手多样性与推荐来源记录等通用思路。未复制其源码、模型或数据；参考版本的许可范围存在歧义，详见下方说明。',
          en: 'General ideas for candidate fusion, deduplication, artist diversity, and recording recommendation sources. No source, models, or data were copied. The reference revision has an ambiguous license scope, detailed below.'
        }
      },
      {
        name: {zh: '工具与素材', en: 'Tools and Assets'},
        by: {zh: '依赖与资源', en: 'Dependencies and resources'},
        text: {
          zh: link('https://github.com/mrdoob/three.js/tree/r170', 'Three.js 0.170.0') + ' 提供三维渲染，' + link('https://www.npmjs.com/package/lrc-kit/v/1.2.1', 'lrc-kit 1.2.1') + ' 解析歌词，' + link('https://lucide.dev', 'Lucide') + ' 提供图标。</p><p>主题摄影来自 ' + link('https://unsplash.com/license', 'Unsplash') + '，' + link('assets/SOURCES.md', '逐图来源') + '随项目保留。演示音频与歌词文案为本项目原创。',
          en: link('https://github.com/mrdoob/three.js/tree/r170', 'Three.js 0.170.0') + ' provides 3D rendering, ' + link('https://www.npmjs.com/package/lrc-kit/v/1.2.1', 'lrc-kit 1.2.1') + ' parses lyrics, and ' + link('https://lucide.dev', 'Lucide') + ' provides icons.</p><p>Theme photography comes from ' + link('https://unsplash.com/license', 'Unsplash') + ', with ' + link('assets/SOURCES.md', 'per-image sources') + ' included. Demo audio and lyric copy are original to this project.'
        }
      }
    ];
    const licenseNotes = [
      {
        name: 'Claudio',
        text: {
          zh: 'Copyright (c) 2026 hllqkb · ' + link('licenses/Claudio-MIT.txt', '完整 MIT 许可证') + ' · 参考版本 ' + link('https://github.com/hllqkb/Claudio/tree/' + claudioRevision, '<code>' + claudioRevision + '</code>') + '。未复制其源码文件、品牌、截图、音乐或唱片封面。',
          en: 'Copyright (c) 2026 hllqkb · ' + link('licenses/Claudio-MIT.txt', 'Full MIT license') + ' · Reference revision ' + link('https://github.com/hllqkb/Claudio/tree/' + claudioRevision, '<code>' + claudioRevision + '</code>') + '. No source files, branding, screenshots, music, or album artwork were copied.'
        }
      },
      {
        name: 'Qiaomu Music Player Web',
        text: {
          zh: 'Copyright (c) 2026 Qiaomu · ' + link('https://github.com/joeseesun/qiaomu-music-player-web/blob/' + qiaomuRevision + '/LICENSE', 'MIT 许可证') + ' · 参考版本 <code>' + qiaomuRevision + '</code>。未复制其源码、品牌或媒体资产。',
          en: 'Copyright (c) 2026 Qiaomu · ' + link('https://github.com/joeseesun/qiaomu-music-player-web/blob/' + qiaomuRevision + '/LICENSE', 'MIT license') + ' · Reference revision <code>' + qiaomuRevision + '</code>. No source code, branding, or media assets were copied.'
        }
      },
      {
        name: 'Embeat',
        text: {
          zh: '参考版本 <code>' + embeatRevision + '</code> 的 ' + link(embeatRoot + 'README_zh.md', 'README') + ' 将代码与模型声明为 MIT、数据集与数据库声明为 CC BY-NC 4.0，但根目录 ' + link(embeatRoot + 'LICENSE', 'LICENSE') + ' 为 CC BY-NC 4.0，适用范围存在歧义。听间未复制其源码、模型、数据、品牌或媒体，也未接入其 Spotify 数据及向量库。主题匹配使用策划标签，并非声学分析或协同过滤。' + link('https://github.com/HachikoJ/easy-radio-host/blob/main/docs/EMBEAT-ADAPTATION.md', '完整参考说明') + '。',
          en: 'At revision <code>' + embeatRevision + '</code>, the ' + link(embeatRoot + 'README_zh.md', 'README') + ' describes code and models as MIT, and datasets and databases as CC BY-NC 4.0. The root ' + link(embeatRoot + 'LICENSE', 'LICENSE') + ' contains CC BY-NC 4.0, leaving its scope ambiguous. Tingjian copied no source, models, data, branding, or media, and does not use its Spotify data or vector database. Theme matching uses curated tags, not acoustic analysis or collaborative filtering. ' + link('https://github.com/HachikoJ/easy-radio-host/blob/main/docs/EMBEAT-ADAPTATION.md', 'Full adaptation notes') + '.'
        }
      },
      {
        name: {zh: '依赖许可证', en: 'Dependency Licenses'},
        text: {
          zh: 'Three.js 0.170.0：Copyright © 2010-2024 three.js authors · ' + link('vendor/three/LICENSE', 'MIT') + '。lrc-kit 1.2.1：Copyright (c) 2016 Weirong Xu · ' + link('vendor/lrc-kit/LICENSE', 'MIT') + '，仅为浏览器模块导入补充 .js 扩展名。Lucide 图标遵循 ' + link('assets/LICENSE-lucide', 'ISC 许可') + '。上述许可不改变整个仓库的授权状态。',
          en: 'Three.js 0.170.0: Copyright © 2010-2024 three.js authors · ' + link('vendor/three/LICENSE', 'MIT') + '. lrc-kit 1.2.1: Copyright (c) 2016 Weirong Xu · ' + link('vendor/lrc-kit/LICENSE', 'MIT') + '; only .js extensions were added to browser module imports. Lucide icons use the ' + link('assets/LICENSE-lucide', 'ISC license') + '. These licenses do not relicense the repository as a whole.'
        }
      }
    ];
    const mediaNotes = {
      zh: [
        '音乐与歌词通过现有 GD 音乐 API 获取，歌词仅作短时内存缓存，版权归原权利人。软件许可不替代歌曲、歌词、图片、商标或服务的授权；致谢不代表关联或背书。DeepSeek、MiniMax 和 edge-tts 遵循各自服务条款。',
        '唱片几何、样式、Shader、音频分析接入与二维回退均由听间实现。网易云音乐等播放器仅作为通用交互参考，未复制其代码、品牌、皮肤或媒体。用户提供的参考图不随项目分发；唱片中心是注明来源的主题摄影，不代表歌曲实际专辑封面。',
        '浏览器与音源支持时，通过原生 captureStream 与 Web Audio 旁路分析频段、低频和音量，保留原生音频输出。无法分析时使用平滑播放动画，不支持 WebGL 时使用二维涟漪，不宣称所有设备都展示真实频谱。'
      ],
      en: [
        'Music and lyrics come from the existing GD music API, with lyrics cached briefly in memory. Rights remain with their owners. Software licenses do not grant rights to songs, lyrics, imagery, trademarks, or services. Attribution implies no affiliation or endorsement. DeepSeek, MiniMax, and edge-tts remain subject to their service terms.',
        'Tingjian implements its own disc geometry, styling, shaders, audio-analysis integration, and 2D fallback. NetEase Cloud Music and other players are references for common interactions only; no code, branding, skins, or media were copied. User-provided reference imagery is not redistributed. The disc center uses attributed theme photography, not the track\'s actual album artwork.',
        'Where the browser and source support it, native captureStream and a separate Web Audio analysis branch measure frequency bands, bass, and volume while preserving native audio output. Smooth playback animation is used when analysis is unavailable, with 2D ripples when WebGL is unavailable. A real-time spectrum is not claimed on every device.'
      ]
    };
    function renderLanguage(language) {
      const english = language === 'en';
      const localized = value => typeof value === 'string' ? value : value[language];
      const openDetails = Array.from(document.querySelectorAll('#credits details'), item => item.open);
      document.documentElement.lang = english ? 'en' : 'zh-CN';
      document.title = english ? 'Open Source Credits · Tingjian' : '开源致谢 · 听间';
      document.getElementById('page-title').textContent = english ? 'Open Source Credits' : '开源致谢';
      document.getElementById('brand-name').textContent = english ? 'Tingjian' : '听间';
      document.querySelector('.brand').setAttribute('aria-label', english ? 'Open Tingjian in a new tab' : '在新标签页打开听间');
      document.getElementById('intro').textContent = english
        ? 'Tingjian benefits from the work of open source authors, maintainers, and creators. Thank you to these projects and resources.'
        : '听间的成长，离不开开源作者、工具维护者与创作者的分享。感谢以下项目与资源。';
      // Content and URLs below are fixed attribution records, never user input.
      document.getElementById('credits').innerHTML = credits.map(item =>
        '<section class="credit"><div><h2>' + (item.url ? link(item.url, localized(item.name)) : localized(item.name)) +
        '</h2><span class="byline">' + localized(item.by) + '</span></div><div><p>' + localized(item.text) + '</p></div></section>'
      ).join('') + '<details><summary>' + (english ? 'Licenses and Reference Revisions' : '许可证与参考版本') + '</summary><div class="detail-content">' +
        licenseNotes.map(item => '<h3>' + localized(item.name) + '</h3><p>' + localized(item.text) + '</p>').join('') +
        '</div></details><details><summary>' + (english ? 'Music, Lyrics, and Visual Motion' : '音乐、歌词与动效说明') + '</summary><div class="detail-content">' +
        mediaNotes[language].map(text => '<p>' + text + '</p>').join('') + '</div></details>';
      document.querySelectorAll('#credits details').forEach((item, index) => { item.open = Boolean(openDetails[index]); });
      document.querySelectorAll('[data-language]').forEach(item => item.setAttribute('aria-pressed', String(item.dataset.language === language)));
      document.querySelectorAll('[data-zh]').forEach(item => { item.textContent = item.dataset[language]; });
    }
    document.querySelectorAll('[data-language]').forEach(button => button.addEventListener('click', () => renderLanguage(button.dataset.language)));
    renderLanguage('zh');
    try {
      const source = new URL(document.referrer);
      if (source.origin === location.origin && source.searchParams.get('demo') === '1') {
        document.getElementById('back').href = './?demo=1';
        document.querySelector('.brand').href = './?demo=1';
      }
    } catch { /* Direct visits use the normal entry. */ }
  </script>
</body>
</html>
