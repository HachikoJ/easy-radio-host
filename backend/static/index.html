<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小蓝电台 · AI 音乐电台</title>
<style>
  body{font-family:system-ui,sans-serif;background:radial-gradient(circle at 30% 20%,#12263a,#0a1420 70%);
       color:#e6f1ff;margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px}
  .wrap{max-width:640px;width:100%}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  h1{font-size:20px;margin:0}
  .sub{color:#7fa8d0;font-size:12px;margin:2px 0 14px}
  button{background:#1f6feb;border:0;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;cursor:pointer}
  button:disabled{opacity:.5}
  .btnbar button{background:#2c4a6e;margin-right:6px}
  .meta{color:#5f82a8;font-size:12px}
  .tag{display:inline-block;background:#1f6feb22;border:1px solid #1f6feb66;color:#9fd0ff;
       padding:2px 10px;border-radius:20px;font-size:12px;margin:2px 4px 2px 0}
  .card{background:#132a42;border:1px solid #24445f;border-radius:14px;padding:14px;margin:12px 0}
  .host{color:#9fd0ff}.song{color:#9be8c0}
  .now{color:#ffd479;font-weight:600}
  .text{color:#c6dcf2;font-size:14px;line-height:1.6;white-space:pre-wrap}
  .bubble{background:#0e2036;border-radius:12px;padding:12px;font-size:14px;line-height:1.7;white-space:pre-wrap;margin-top:6px}
  .chatline{display:flex;gap:8px;margin:10px 0}
  input{flex:1;background:#0e2036;border:1px solid #24445f;border-radius:10px;color:#fff;padding:10px}
  .chatlog{max-height:150px;overflow:auto;font-size:13px;color:#9fc2e8}
  .chatlog div{margin:3px 0}
  .auto{display:flex;align-items:center;gap:8px;font-size:13px;color:#7fa8d0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>🎙 小蓝电台</h1>
    <div class="auto"><input type="checkbox" id="auto" checked>自动广播</div>
  </div>
  <div class="sub">DeepSeek 主持 · MiniMax 女声 · 在线音乐曲库 · 点歌即插播</div>
  <div><button id="gen">生成一期节目</button></div>
  <div class="btnbar" style="margin-top:8px">
    <button id="b_prev">⏮ 上段</button>
    <button id="b_play">⏸ 暂停</button>
    <button id="b_next">⏭ 下段</button>
  </div>

  <div class="card">
    <div id="meta"></div>
    <div id="nowcard" class="meta">点上方按钮开播</div>
    <div id="bubble" class="bubble" style="display:none"></div>
  </div>
  <audio id="au" style="display:none"></audio>

  <div class="chatline">
    <input id="msg" placeholder="点歌或聊两句：比如「来首安静的」" />
    <button id="send">说给主持人</button>
  </div>
  <div class="chatlog" id="chatlog"></div>
</div>

<script>
const au=document.getElementById('au');
let seq=[], idx=-1, recent=[];
let auto=document.getElementById('auto').checked;
// 插播: 中断当前段, 播完插播后回到原段位置
let resume=null, irqItems=[], irqIdx=0;
let _guard=false;

function fmt(s){return s.length>46?s.slice(0,46)+'…':s}
function chatLog(html){const el=document.getElementById('chatlog');el.insertAdjacentHTML('afterbegin','<div>'+html+'</div>');}
function showCard(it){
  const c=document.getElementById('nowcard');
  if(it.kind==='talk' || it.kind==='text'){
    c.innerHTML='<div class="host now">🎙 '+fmt(it.title)+'</div>';
    const b=document.getElementById('bubble'); b.style.display='block';
    b.innerHTML='<div class="host">'+it.title+'</div><div class="text">'+it.text+'</div>';
  } else {
    c.innerHTML='<div class="song now">♪ '+fmt(it.title)+'</div>';
    document.getElementById('bubble').style.display='none';
  }
}
function card(meta){
  document.getElementById('meta').innerHTML =
    meta? '<span class="tag">'+meta.theme+'</span><span class="tag">'+meta.time+'</span>'
         +'<div class="meta">“'+meta.slogan+'”</div>' : '';
}
function setPauseLabel(){
  document.getElementById('b_play').textContent = au.paused ? '▶ 播放' : '⏸ 暂停';
}
// 加载并播放一段 (立即切换)
function playRaw(it){
  showCard(it);
  if(it.kind==='text' || !it.url){          // 纯文稿: 停留可读时长后继续
    const secs=Math.max(4,Math.min(12,Math.ceil((it.text||'').length/10)));
    setTimeout(()=>beginNext(false), secs*1000);
    return;
  }
  if(it.kind==='song'){ recent.push(it.title); if(recent.length>10)recent.shift(); }
  au.src=it.url;
  const p=au.play();
  if(p){ p.then(()=>setPauseLabel()).catch(()=>{   // 被浏览器拦: 口播看文稿, 歌曲短停后继续
      if(it.kind==='talk') talkFallback(it); else beginNext(false);
  }); } else setPauseLabel();
}
function talkFallback(it){
  const secs=Math.max(4,Math.min(12,Math.ceil(it.text.length/10)));
  showCard({kind:'talk',title:it.title+'(语音未就绪)',text:it.text});
  setTimeout(()=>beginNext(false), secs*1000);
}
// 统一"一段播完/切下"入口
let _deferred=null;   // guard 释放后执行(避免意图动作被锁吞)
function beginNext(fromUser){
  if(_guard) return; _guard=true;
  try{
    if(resume){                       // 正在插播: 播完处理意图动作或回到被打断位置
      irqIdx++;
      if(irqIdx < irqItems.length){ playRaw(irqItems[irqIdx]); return; }
      const r=resume; resume=null; irqItems=[]; irqIdx=0;
      const pe=pendingEndAct; pendingEndAct=null;
      if(pe){ _deferred=pe; return; }  // 意图动作(切/停/换台): guard 释放后再执行, 不回原段
      const it=seq[idx];
      if(it){ showCard(it); au.src=r.src; au.currentTime=r.pos;
              const p=au.play(); if(p)p.then(()=>setPauseLabel()).catch(()=>{}); }
      return;
    }
    idx++;
    if(idx < seq.length){ playRaw(seq[idx]); return; }
    seq=[]; idx=-1;
    document.getElementById('nowcard').innerHTML='<div class="meta">本期播完。</div>';
    document.getElementById('bubble').style.display='none';
    if(auto) nextShow();
  } finally {
    setTimeout(()=>{ _guard=false; const f=_deferred; _deferred=null; if(f){ try{f();}catch(e){console.log(e);} } }, 750);
  }
}
au.addEventListener('ended',()=>beginNext(false));
au.addEventListener('error',()=>{
  const it = resume? irqItems[irqIdx] : seq[idx];
  if(it && it.kind==='talk') talkFallback(it); else beginNext(false);
});
// 看门狗: 接近片尾确保推进
au.addEventListener('timeupdate',()=>{
  if(!au.paused && au.duration>0 && (au.duration-au.currentTime)<0.25) beginNext(false);
});
// 控制
document.getElementById('b_prev').onclick=doPrev;
document.getElementById('b_play').onclick=()=>{
  if(au.paused){ const p=au.play(); if(p)p.then(()=>setPauseLabel()).catch(()=>{}); }
  else au.pause();
  setPauseLabel();
};
document.getElementById('b_next').onclick=doNext;
au.addEventListener('pause',setPauseLabel);
au.addEventListener('play',setPauseLabel);

async function startShow(items, theme){
  resume=null; irqItems=[]; irqIdx=0; pendingEndAct=null;  // 整期替换
  window._curTheme = theme || window._curTheme || '';
  seq=items; idx=0;
  playRaw(seq[0]);
}
async function nextShow(theme){
  try{
    const r=await fetch('/api/show',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({exclude:recent, theme: theme||''})});
    const d=await r.json();
    card(d.meta);
    await startShow(d.items, d.meta.theme);
  }catch(e){ console.log(e); }
}
document.getElementById('gen').onclick=()=>nextShow();

let pendingEndAct=null;   // 插播结束后执行一次的动作(意图控制/换台)
function doNext(){ beginNext(true); }
function doPrev(){
  if(seq.length===0) return;
  if(resume){ resume=null; irqItems=[]; irqIdx=0; }
  if(idx>0){ idx--; playRaw(seq[idx]); }
  else { au.currentTime=0; if(au.paused){ const p=au.play(); if(p)p.catch(()=>{});} }
}
function doStop(){ resume=null; irqItems=[]; irqIdx=0; seq=[]; idx=-1; au.pause();
  document.getElementById('nowcard').innerHTML='<div class="meta">已停止。</div>';
  document.getElementById('bubble').style.display='none';
}
function doInsert(items){
  if(!items.length) return;
  const idle = (seq.length===0);
  if(idle){ seq=items; idx=0; playRaw(items[0]); return; }
  if(resume){ irqItems.push(...items); return; }
  resume={src:au.src, pos:au.currentTime};
  irqItems=items; irqIdx=0;
  playRaw(irqItems[0]);
}
async function sendChat(){
  const msg=document.getElementById('msg').value.trim();
  if(!msg) return;
  document.getElementById('msg').value='';
  chatLog('<b style="color:#8fc7ff">你：</b>'+msg);
  const cur=seq[idx];
  try{
    const r=await fetch('/api/intent',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg, exclude:recent,
        state:{playing:!au.paused && seq.length>0, paused:au.paused,
               current: cur?cur.title:'', theme:(window._curTheme||''), auto:auto}})});
    const d=await r.json();
    const items=d.items||[], acts=d.actions||[];
    for(const it of items){
      if(it.kind==='talk'||it.kind==='text') chatLog('<b class="host">🎙 小蓝：</b>'+(it.text||''));
      else chatLog('<b class="song">♪ 播放：</b>'+it.title);
    }
    const actFn={ pause:()=>au.pause(),
                  resume:()=>{const p=au.play();if(p)p.catch(()=>{});},
                  next:()=>doNext(), prev:()=>doPrev(), stop:()=>doStop() };
    acts.filter(a=>a.type==='set_auto').forEach(a=>{ auto=a.on; document.getElementById('auto').checked=a.on; });
    const playTheme=acts.find(a=>a.type==='play_theme');
    const controls=acts.filter(a=>['pause','resume','next','prev','stop'].includes(a.type));
    if(playTheme){
      // 换台: 先播回复口播(若有), 播完自动开新主题一期
      if(items.length){ pendingEndAct=()=>nextShow(playTheme.theme); doInsert(items); }
      else nextShow(playTheme.theme);
      return;
    }
    if(items.length && controls.length){
      pendingEndAct=()=>{ controls.forEach(a=>actFn[a.type]&&actFn[a.type]()); };
      doInsert(items);
    } else {
      controls.forEach(a=>actFn[a.type]&&actFn[a.type]());
      if(items.length) doInsert(items);
    }
  }catch(e){ console.log(e); }
}
document.getElementById('send').onclick=sendChat;
document.getElementById('msg').addEventListener('keydown',e=>{ if(e.key==='Enter')sendChat(); });
document.getElementById('auto').onchange=e=>{ auto=e.target.checked; if(auto && seq.length===0) nextShow(); };
</script>
</body>
</html>
